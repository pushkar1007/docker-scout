version: "3.9"

services:
  docker_api_server:
    build: .
    container_name: docker_api_server
    ports:
      - "3000:3000"
    environment:
      - DOCKER_SCOUT_ADDR=0.0.0.0:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy-net
networks:
  proxy-net:
    external: true

